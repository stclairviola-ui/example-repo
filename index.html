<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick-Fire Multiplication</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f4f8; }
        .game-container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        h1 { color: #333; margin-bottom: 0.5rem; }
        #question { font-size: 2.5rem; font-weight: bold; margin: 20px 0; color: #2c3e50; }
        input { width: 80%; padding: 10px; font-size: 1.2rem; border: 2px solid #ddd; border-radius: 5px; margin-bottom: 10px; outline: none; }
        input:focus { border-color: #3498db; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2980b9; }
        .score-board { margin-top: 20px; font-weight: bold; color: #7f8c8d; }
        #feedback { height: 20px; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Math Quiz</h1>
    <div id="question">? x ?</div>
    <input type="number" id="answer" placeholder="Type answer..." autofocus>
    <br>
    <button onclick="checkAnswer()">Submit</button>
    
    <div id="feedback"></div>
    <div class="score-board">Score: <span id="score">0</span></div>
</div>

<script>
    let num1, num2, correctAnswer;
    let score = 0;

    const questionElement = document.getElementById('question');
    const answerInput = document.getElementById('answer');
    const scoreElement = document.getElementById('score');
    const feedbackElement = document.getElementById('feedback');

    function generateQuestion() {
        // Generate two random numbers between 1 and 12
        num1 = Math.floor(Math.random() * 12) + 1;
        num2 = Math.floor(Math.random() * 12) + 1;
        correctAnswer = num1 * num2;
        
        questionElement.innerText = `${num1} × ${num2}`;
        answerInput.value = '';
        answerInput.focus();
    }

    function checkAnswer() {
        const userAnswer = parseInt(answerInput.value);

        if (userAnswer === correctAnswer) {
            score++;
            feedbackElement.innerText = "Correct! 🎉";
            feedbackElement.style.color = "#27ae60";
        } else {
            feedbackElement.innerText = `Wrong! It was ${correctAnswer}.`;
            feedbackElement.style.color = "#e74c3c";
            // Optional: reset score on wrong answer
            // score = 0; 
        }

        scoreElement.innerText = score;
        generateQuestion();
    }

    // Allow pressing "Enter" to submit
    answerInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });

    // Start the first question
    generateQuestion();
</script>

</body>
</html>
